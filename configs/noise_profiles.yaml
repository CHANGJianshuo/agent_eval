# 噪音档位 —— persona 的正交第三层,决定「用户输入有多脏」。
# instruction 会注入用户模拟器的 system prompt。
# 默认所有 persona 用 clean;噪音档作鲁棒性专项时再切换。

clean:
  name: 无噪音
  instruction: ""

light:
  name: 轻度口语噪音
  instruction: |
    回复时偶尔带一点口语填充词(如「呃」「那个」「就是」),
    偶尔重复一两个字或半句话,但整体仍清楚可懂。

heavy:
  name: 重度噪音(模拟嘈杂电话信道)
  instruction: |
    模拟嘈杂电话环境下的真实通话:
    - 偶尔有同音字听错(如把专有名词说成相近的错词);
    - 夹杂口语填充词和语气词,句子有时不完整;
    - 偶尔答非所问,或要求对方再说一遍。
    注意:仍要保持基本可沟通,不要完全无法理解。
