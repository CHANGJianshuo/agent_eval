[project]
name = "claw-eval"
version = "0.1.0"
description = "履约数字人外呼场景 · 对话模型指令遵循自动评测系统"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.40",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
claw-eval = "claw_eval.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claw_eval = ["report/templates/*.j2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
