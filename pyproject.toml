[project]
name = "DialAgentEval"
version = "0.1.0"
description = "履约数字人外呼场景 · 对话模型指令遵循自动评测系统"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.40",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "fastapi>=0.110"]
ui  = ["streamlit>=1.30", "pandas>=2.0"]      # Streamlit UI (legacy)
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]   # FastAPI + React UI (推荐)
browser = ["playwright==1.58.0"]   # 可选：真实浏览器流程回归（使用离线模型）

[project.scripts]
# 主推 CLI(产品改名后的新命令)
dial-agent-eval = "claw_eval.cli:main"
# 旧命令保留(向后兼容,跟所有现有 README 例子兼容)
claw-eval       = "claw_eval.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claw_eval = ["report/templates/*.j2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
