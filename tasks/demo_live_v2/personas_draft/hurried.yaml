id: hurried
personality: hurried
name: 匆忙型负责人
states:
  接听: 你接起电话，语气有些急。
  打断: 客服刚说两句，你就表示自己很忙，没时间听。
  犹豫: 听到‘就1分钟’后，你稍微停顿，但依然催促。
  快速确认: 你快速听完核心升级内容，只问一句最关键的。
  挂断: 你直接挂断电话。
initial_state: 接听
transitions:
  接听: 打断
  打断: 犹豫
  犹豫: 快速确认
  快速确认: 挂断
probes:
- id: say_busy
  inject_at_turn: 1
  text: 我正忙着呢，没空听你说这些。
  description: 触发 busy_retain 节点，模拟客户说忙的情况。
max_rounds: 12
covers_flow_nodes:
- opening
- step1
- busy_retain
- end
