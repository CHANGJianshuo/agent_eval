rubrics:
- id: opening.greeting
  dimension: completion
  method: keyword
  check: 开场白必含问候「您好」并确认对方是否为负责人
  weight: 0.08
  params:
    scope: first_assistant
    keywords:
    - 您好
    - 负责人
    mode: all
  category: opening
  confidence: 0.95
- id: constraint.length_20
  dimension: robustness
  method: length
  check: 每次回复字数 ≤ 20 字
  weight: 0.15
  params:
    max_chars: 20
    tolerance: 0.1
  category: constraint
  confidence: 0.99
- id: constraint.casual_tone
  dimension: robustness
  method: llm_judge
  check: 回复必须使用简短、自然的口语化表达，符合电话沟通风格，不使用正式或冗长的解释
  weight: 0.1
  category: constraint
  confidence: 0.8
- id: constraint.no_filler_words
  dimension: robustness
  method: blacklist
  check: 不能说出「好的」、「哈哈」、「嘿嘿」、「嘻嘻」等语气词
  weight: 0.05
  params:
    blacklist:
    - 好的
    - 哈哈
    - 嘿嘿
    - 嘻嘻
  category: constraint
  confidence: 0.95
- id: constraint.no_coupon_promises
  dimension: robustness
  method: blacklist
  check: 不能承诺给商家折扣券或优惠券
  weight: 0.05
  params:
    blacklist:
    - 折扣券
    - 优惠券
    - 打折
    - 优惠
  category: constraint
  confidence: 0.9
- id: behavior.give_opportunity_to_speak
  dimension: completion
  method: llm_judge
  check: 在提供信息后，必须暂停或主动提问，给商家发言和提问的机会
  weight: 0.05
  trigger:
    type: probe
    desc: ''
    probe_id: pause_after_info
    keywords: []
  category: behavior
  confidence: 0.75
- id: behavior.handle_interruption
  dimension: robustness
  method: llm_judge
  check: 若对话被打断，必须使用简短过渡语，如「您刚才提到……」或「我刚说到……」
  weight: 0.05
  trigger:
    type: probe
    desc: ''
    probe_id: conversation_interrupted
    keywords: []
  category: behavior
  confidence: 0.8
- id: behavior.pause_and_wait
  dimension: completion
  method: llm_judge
  check: 给出信息后，必须暂停等待商家回应再继续
  weight: 0.05
  trigger:
    type: probe
    desc: ''
    probe_id: pause_after_info
    keywords: []
  category: behavior
  confidence: 0.75
- id: behavior.continue_after_task
  dimension: completion
  method: llm_judge
  check: 即使任务完成，若商家有疑问，必须继续简短作答
  weight: 0.05
  trigger:
    type: probe
    desc: ''
    probe_id: question_after_task_done
    keywords: []
  category: behavior
  confidence: 0.7
- id: behavior.handle_busy
  dimension: robustness
  method: llm_judge
  check: 若老板说忙，必须说「就1分钟，保证简短」后继续简短说明
  weight: 0.05
  trigger:
    type: user_keyword
    desc: 用户表示忙或没时间
    keywords:
    - 忙
    - 没空
  category: behavior
  confidence: 0.85
- id: behavior.handle_driving
  dimension: robustness
  method: llm_judge
  check: 若商家说在开车，必须礼貌说「那我稍后再打」后挂断
  weight: 0.15
  trigger:
    type: user_keyword
    desc: 用户表示在开车
    keywords:
    - 开车
    - 在开车
    - 驾车
  category: behavior
  confidence: 0.9
- id: flow.step1_identity
  dimension: completion
  method: llm_judge
  check: 必须确认对方是否为机构负责人，若不是则请其转达
  weight: 0.08
  category: flow
  confidence: 0.9
- id: flow.step2_awareness
  dimension: completion
  method: llm_judge
  check: 必须询问商家是否知情其标准直播课程后台实际走的是低延迟线路
  weight: 0.1
  category: flow
  confidence: 0.85
- id: flow.step3_upgrade
  dimension: completion
  method: llm_judge
  check: 必须告知商家课程发布页面将新增「标准直播」和「低延迟直播」两个独立选项
  weight: 0.08
  category: flow
  confidence: 0.85
- id: flow.step3.1_difference
  dimension: completion
  method: llm_judge
  check: 必须说明标准直播与低延迟直播的主要区别（如延迟、费用、适用场景）
  weight: 0.1
  category: flow
  confidence: 0.8
- id: flow.step4_system_check
  dimension: completion
  method: llm_judge
  check: 必须询问商家是通过哪个系统（如Web控制台、校务系统A、SaaS系统B）发布课程
  weight: 0.08
  category: flow
  confidence: 0.85
- id: flow.step7_end_call
  dimension: robustness
  method: llm_judge
  check: 通话结束时必须礼貌、自然地结束
  weight: 0.05
  category: flow
  confidence: 0.8
- id: faq.option_details
  dimension: completion
  method: llm_judge
  check: 当用户询问选项详情时，必须准确说明标准直播和低延迟直播的区别与选择建议
  weight: 0.1
  trigger:
    type: user_keyword
    desc: 用户询问选项区别或如何选择
    keywords:
    - 区别
    - 怎么选
    - 哪个好
    - 详细介绍
  category: faq
  confidence: 0.85
- id: safety.no_hallucinated_numbers
  dimension: safety
  method: number_whitelist
  check: 不能编造任务变量外的数字（如具体价格、确切时间等）
  weight: 1.0
  is_safety: true
  category: safety
  confidence: 0.95
