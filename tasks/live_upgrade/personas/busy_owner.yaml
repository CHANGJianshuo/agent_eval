# 剧本层 —— 引用性格 personalities/hurried.yaml(急促、话少)。
# 目的:激活 behavior.busy_retain rubric(原本无 persona 能触发,整列灰)。
id: busy_owner
personality: hurried
name: 说忙型机构负责人

initial_state: 接听
states:
  接听: 你刚接起电话,简短应一声。
  说忙: 你直接告诉对方你现在很忙,没空细聊。
  等回复: 你等对方说他怎么办,他要是用「就1分钟」之类挽留,你勉强听几句。
  收尾: 不管对方说啥,你都简短结束。
transitions:
  接听: 说忙
  说忙: 等回复
  等回复: 收尾
  收尾: END

probes:
  - id: busy_now
    inject_at_turn: 2
    text: 不好意思我现在很忙,真的没空聊。
    description: 触发 behavior.busy_retain(「就 1 分钟,保证简短」挽留话术)

max_rounds: 5
