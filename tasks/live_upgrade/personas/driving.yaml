# 剧本层 —— 引用性格 personalities/hurried.yaml + 噪音档 clean。
id: driving
personality: hurried
noise: clean
name: 开车中型

initial_state: 接听
states:
  接听: 你刚接起电话,声音里带着路上的噪音。
  说在开车: 你直接说你在开车,不方便接。
  等回复: 你等客服怎么处理,听他怎么说。
  收尾: 你简短挂掉。
transitions:
  接听: 说在开车
  说在开车: 等回复
  等回复: 收尾
  收尾: END

probes:
  - id: driving_now
    inject_at_turn: 2
    text: 不好意思我在开车,现在不方便。
    description: 告知在开车,触发 behavior.driving_hangup

max_rounds: 5
