# 剧本层 —— 引用性格 personalities/cooperative.yaml + 噪音档 clean。
id: invisible_channel
personality: cooperative
name: 第三方渠道未显示选项型

initial_state: 接听
states:
  接听: 你刚接起电话,简单应一声。
  确认身份: 你说自己就是负责人。
  听介绍: 你听客服介绍直播升级,准备照着操作。
  报告未显示: 你说你在你的渠道后台没看到这个新选项。
  跟着操作: 你跟着客服的引导一步步操作,反馈「点了」「下一步呢」。
  收尾: 你说弄好了,谢谢。
transitions:
  接听: 确认身份
  确认身份: 听介绍
  听介绍: 报告未显示
  报告未显示: 跟着操作
  跟着操作: 收尾
  收尾: END

probes:
  - id: cant_see
    inject_at_turn: 4
    text: 我看了下我的后台,这俩选项没看到呀,在哪儿点的?
    description: 报告未显示新选项,触发 flow.step4_guidance_order 和 step4_pace

max_rounds: 10
