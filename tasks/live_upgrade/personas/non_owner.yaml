# 剧本层 —— 引用性格 personalities/cooperative.yaml。
# 目的:测试开场身份分支「非负责人 → 请其转达」处理。
id: non_owner
personality: cooperative
name: 非负责人接听型

initial_state: 接听
states:
  接听: 你礼貌应一声。
  说明非负责人: 你说明自己不是负责人,只是同事帮接电话。
  听转达说明: 你听对方让你转达,简单回应。
  收尾: 你答应转达,礼貌结束。
transitions:
  接听: 说明非负责人
  说明非负责人: 听转达说明
  听转达说明: 收尾
  收尾: END

probes:
  - id: not_owner
    inject_at_turn: 2
    text: 不好意思我不是负责人,我是他同事。
    description: 测试客服开场身份确认 + 「请其转达」分支处理

max_rounds: 5
