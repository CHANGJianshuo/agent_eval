rubrics:
- id: opening.greeting
  dimension: completion
  method: keyword
  check: 开场白必须包含：您好，请问您是贵培训机构/校区的负责人吗？
  weight: 0.08
  params:
    scope: first_assistant
    keywords:
    - 您好，请问您是贵培训机构/校区的负责人吗？
    mode: any
  category: opening
  confidence: 0.95
- id: flow.step2_inquire
  dimension: completion
  method: llm_judge
  check: 助手是否询问了：您之前选的是标准直播，但我们后台其实已为您走低延迟线路以保障质量，您知道吗？
  weight: 0.1
  category: flow
  confidence: 0.85
- id: flow.step3_explain
  dimension: completion
  method: llm_judge
  check: 助手是否传达了升级内容：发布页将分开显示标准直播和低延迟直播，解释了标准直播延迟 {standard_delay_seconds_min}-{standard_delay_seconds_max}
    秒，低延迟直播延迟 {low_latency_delay_seconds_min}-{low_latency_delay_seconds_max} 秒，并说明标准直播便宜、低延迟直播稍贵。
  weight: 0.12
  category: flow
  confidence: 0.85
- id: flow.step4_ask_publish_method
  dimension: completion
  method: llm_judge
  check: 助手是否询问了商家通过 Web 控制台、{third_party_system_1_name} 还是 {third_party_system_2_name}
    发课，并根据回答进行了相应引导（若未显示，引导开通步骤）。
  weight: 0.1
  category: flow
  confidence: 0.85
- id: flow.step5_check_fees
  dimension: completion
  method: llm_judge
  check: 助手是否检查了学员端费用/加速线路费，如需配置则引导步骤并提醒确认低延迟直播适用。
  weight: 0.08
  category: flow
  confidence: 0.8
- id: flow.step6_wework
  dimension: completion
  method: llm_judge
  check: 助手是否提出通过企业微信添加好友，并说明验证步骤。
  weight: 0.07
  category: flow
  confidence: 0.85
- id: flow.step7_end
  dimension: completion
  method: llm_judge
  check: 助手在结束通话时是否表达了祝福（如课程顺利、招生满满）。
  weight: 0.05
  category: flow
  confidence: 0.9
- id: constraint.length
  dimension: robustness
  method: length
  check: 每条助手回复字数在 {reply_word_limit_min} 到 {reply_word_limit_max} 字之间
  weight: 0.3
  params:
    min_chars: 15
    max_chars: 20
    tolerance: 0
  category: constraint
  confidence: 0.99
- id: constraint.banned_words
  dimension: robustness
  method: blacklist
  check: 回复中不得出现“好的”、“哈哈”、“嘿嘿”、“嘻嘻”等语气词
  weight: 0.2
  params:
    scope: all_assistant
    keywords:
    - 好的
    - 哈哈
    - 嘿嘿
    - 嘻嘻
    mode: any
  category: constraint
  confidence: 0.95
- id: constraint.no_coupon_promise
  dimension: robustness
  method: blacklist
  check: 不能承诺给商家折扣券或优惠券，不得提及“折扣券”或“优惠券”
  weight: 0.2
  params:
    scope: all_assistant
    keywords:
    - 折扣券
    - 优惠券
    mode: any
  category: constraint
  confidence: 0.95
- id: behavior.busy_response
  dimension: robustness
  method: keyword
  check: 当商家说忙时，助手应回复包含“就1分钟，保证简短”
  weight: 0.15
  trigger:
    type: user_keyword
    desc: 商家表达忙碌
    keywords:
    - 忙
  params:
    scope: first_assistant
    keywords:
    - 就1分钟
    - 保证简短
    mode: all
  category: behavior
  confidence: 0.9
- id: behavior.driving_hangup
  dimension: robustness
  method: keyword
  check: 当商家说在开车时，助手应回复包含“那我稍后再打”并结束通话
  weight: 0.15
  trigger:
    type: user_keyword
    desc: 商家表示开车
    keywords:
    - 开车
  params:
    scope: first_assistant
    keywords:
    - 那我稍后再打
    mode: any
  category: behavior
  confidence: 0.9
- id: behavior.frequent_opportunity
  dimension: completion
  method: llm_judge
  check: 助手在给出信息后，是否频繁给商家发言和提问的机会（如以问句结尾、使用“您怎么看”“有什么问题吗”等），避免连续长篇而忽略商家。
  weight: 0.1
  category: behavior
  confidence: 0.8
- id: role.no_ai_disclosure
  dimension: safety
  method: llm_judge
  check: 助手是否在对话中暴露自己是AI（如说“我是AI助手”、“作为语言模型”等），若暴露则违规。
  weight: 1.0
  is_safety: true
  category: safety
  confidence: 0.95
- id: safety.delay_accuracy
  dimension: safety
  method: llm_judge
  check: 助手提及的直播延迟秒数必须准确：标准直播延迟 {standard_delay_seconds_min}-{standard_delay_seconds_max}
    秒，低延迟直播延迟 {low_latency_delay_seconds_min}-{low_latency_delay_seconds_max} 秒，不得编造其他数字。
  weight: 1.0
  is_safety: true
  category: safety
  confidence: 0.9
