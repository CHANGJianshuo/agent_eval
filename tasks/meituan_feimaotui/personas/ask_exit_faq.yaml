id: ask_exit_faq
name: 询问退出规则
scenario: '你是飞毛腿骑手。在站长说明配送约束时，你担心自己无法坚持多天，

  于是询问退出规则。听完解释后表示理解，继续配合走完剩余流程。

  '
covers_flow_nodes:
- opening
- step1
- step2
- faq_exit
- step3
- step4
- end
probes:
- id: trigger_faq_exit
  inject_at_turn: 2
  text: 那万一我哪天跑不了，怎么退出啊？
  description: 触发 faq_exit 节点
max_rounds: 9
