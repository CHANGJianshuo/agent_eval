id: refuse_to_deliver
name: 坚持无法配送
scenario: '你是飞毛腿骑手。站长告知合同生效并说明配送约束时，你表示最近腰疼实在跑不动。

  对方挽留，你仍然坚持无法配送，对方安慰后挂断电话。

  '
covers_flow_nodes:
- opening
- step1
- step2
- step3
- end
probes:
- id: user_refuse
  inject_at_turn: 2
  text: 站长，我最近腰疼得厉害，真跑不动，这次可能得放弃了。
  description: 在 step2 时表达无法配送，导致挽留无效走 step3→end
max_rounds: 7
