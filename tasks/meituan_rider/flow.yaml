# 美团飞毛腿外呼任务流程图
# 主流程横向 + 触发型节点(faq/越权/挂断)作为分支。
# 节点的 rubric 字段决定 dashboard 渲染时的颜色(按该 rubric pass 率)。
nodes:
  - {id: opening,        label: 开场白(称呼+站长+飞毛腿), rubric: opening.greeting}
  - {id: peak,           label: 高峰期上线提醒,             rubric: opening.peak_reminder}
  - {id: step1,          label: 告知合同生效+问能否配送,    rubric: flow.step1_contract}
  - {id: step2,          label: 说明连续 Y 天约束,           rubric: flow.step2_continuous}
  - {id: step3,          label: 鼓励/挽留+提醒安全,          rubric: flow.step3_encourage}
  - {id: step4,          label: 说明排名机制+减少拒单,       rubric: flow.step4_ranking}
  - {id: faq_exit,       label: 答退出规则(Z点前App取消),  rubric: faq.exit_rule,          optional: true}
  - {id: faq_multi,      label: 答多日合同(每天Y单),       rubric: faq.multi_day,         optional: true}
  - {id: oos,            label: 越权问题回退话术,           rubric: behavior.out_of_scope, optional: true}
  - {id: hangup,         label: 坚持拒绝 → 安抚后挂断,       rubric: behavior.comfort_hangup, optional: true}
edges:
  - [opening, peak]
  - [peak, step1]
  - [step1, step2]
  - [step2, step3]
  - [step3, step4]
  - [step2, faq_exit]
  - [faq_exit, step3]
  - [step2, faq_multi]
  - [faq_multi, step3]
  - [step1, oos]
  - [oos, step2]
  - [step3, hangup]
