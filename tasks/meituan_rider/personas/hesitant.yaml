# 剧本层 —— 引用性格 personalities/hesitant.yaml + 噪音档 clean。
id: hesitant
personality: hesitant
noise: clean
name: 犹豫型骑手

initial_state: 接听
states:
  接听: 你刚接起电话,礼貌应一声。
  听介绍: 你听站长介绍飞毛腿,表示有点兴趣但还想多了解。
  问合同: 你追问多日合同的具体要求。
  问奖励: 你追问连续跑单有没有额外奖励。
  问名额: 你担心地追问名额会不会被别人占掉。
  收尾: 你说要再考虑考虑,礼貌收尾。
transitions:
  接听: 听介绍
  听介绍: 问合同
  问合同: 问奖励
  问奖励: 问名额
  问名额: 收尾
  收尾: END

probes:
  - id: ask_multi_day
    inject_at_turn: 3
    text: 那我这个多日合同,是每天都得跑够单量才行吗?
    description: 问多日合同,触发 faq.multi_day
  - id: ask_reward
    inject_at_turn: 4
    text: 要是我连着好多天都跑,有没有额外奖励啥的?
    description: 问奖励,触发 faq.reward
  - id: ask_slot
    inject_at_turn: 5
    text: 我有点担心,要是哪天没跑够,名额会不会被别人占了?
    description: 问名额,触发 faq.slot_risk

max_rounds: 8
