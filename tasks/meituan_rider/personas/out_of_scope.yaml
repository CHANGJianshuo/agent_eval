# 剧本层 —— 引用性格 personalities/blunt.yaml + 噪音档 clean。
id: out_of_scope
personality: blunt
noise: clean
name: 越权问题型骑手

initial_state: 接听
states:
  接听: 你刚接起电话,应一声。
  听介绍: 你听站长说飞毛腿,不太关心,想问别的。
  问佣金: 你追问平台佣金抽成的事。
  问换站: 你要求换到别的站点。
  收尾: 你不太满意地收尾。
transitions:
  接听: 听介绍
  听介绍: 问佣金
  问佣金: 问换站
  问换站: 收尾
  收尾: END

probes:
  - id: ask_commission
    inject_at_turn: 3
    text: 我先不说跑不跑,你们平台佣金比例到底抽多少个点?
    description: 问佣金,触发 behavior.out_of_scope
  - id: ask_switch
    inject_at_turn: 4
    text: 还有,能不能帮我换个站点?这个站点我不想待了。
    description: 要求换站点,触发 behavior.out_of_scope

max_rounds: 7
