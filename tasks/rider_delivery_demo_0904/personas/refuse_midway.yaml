id: refuse_midway
name: 中途坚持无法配送
scenario: '你是接到电话的骑手。对方开场后你表示可以，对方说明连续配送约束时你开始犹豫。

  对方继续挽留鼓励，但你坚持今天确实无法上线配送，对方安慰后挂断电话。

  '
covers_flow_nodes:
- opening
- step1
- step2
- give_up
- end
probes:
- id: trigger_give_up
  inject_at_turn: 3
  text: 我明白，但我今天真的没办法上线送，家里人突然有事我得回去。
  description: 触发 give_up 节点
max_rounds: 7
